<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập - Thi trắc nghiệm</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-page">
    <header
      class="d-flex align-items-center gap-2 p-3 text-primary fs-4 fw-bold"
    >
      <i class="bi bi-check2-square" aria-hidden="true"></i>
      <span>Thi trắc nghiệm</span>
    </header>

    <main class="container px-3 pt-4 pb-5">
      <div class="login-card card card-body shadow-sm border-0 mx-auto p-4">
        <h1 class="fs-3 fw-bold text-center mb-4">Đăng nhập</h1>

        <!-- Hiện khi đăng nhập sai (sau này PHP sẽ điều khiển) -->
        <div class="alert alert-danger d-none" id="loi" role="alert">
          Email hoặc mật khẩu không đúng.
        </div>

        <form id="form-login">
          <div class="mb-3">
            <label for="email" class="visually-hidden">Email</label>
            <input
              type="email"
              class="form-control py-2"
              id="email"
              name="email"
              placeholder="Nhập email"
              autocomplete="username"
              required
            />
          </div>

          <div class="mb-2">
            <label for="mat_khau" class="visually-hidden">Mật khẩu</label>
            <div class="input-group">
              <input
                type="password"
                class="form-control py-2 border-end-0"
                id="mat_khau"
                name="mat_khau"
                placeholder="Mật khẩu"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="btn bg-white border border-start-0 text-secondary"
                id="btn-mat"
                aria-label="Hiện mật khẩu"
              >
                <i class="bi bi-eye-slash" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <a href="#" class="d-inline-block mb-4 text-body text-decoration-none"
            >Quên mật khẩu?</a
          >

          <button type="submit" class="btn btn-primary w-100 py-2">
            Đăng nhập
          </button>
        </form>

        <p class="mt-4 mb-0">
          Bạn chưa có tài khoản?
          <a href="DangKy.html" class="text-primary text-decoration-none"
            >Tạo một tài khoản mới</a
          >
        </p>
      </div>
    </main>

    <script>
      // Hiện / ẩn mật khẩu
      const oMatKhau = document.getElementById("mat_khau");
      const nutMat = document.getElementById("btn-mat");
      nutMat.addEventListener("click", () => {
        const dangAn = oMatKhau.type === "password";
        oMatKhau.type = dangAn ? "text" : "password";
        nutMat.innerHTML =
          '<i class="bi ' +
          (dangAn ? "bi-eye" : "bi-eye-slash") +
          '" aria-hidden="true"></i>';
        nutMat.setAttribute(
          "aria-label",
          dangAn ? "Ẩn mật khẩu" : "Hiện mật khẩu",
        );
      });

      // Tạm thời: bấm Đăng nhập thì chuyển sang trang giảng viên.
      // Khi làm PHP: bỏ đoạn này, đổi thành <form action="login.php" method="post">
      document.getElementById("form-login").addEventListener("submit", (e) => {
        e.preventDefault();
        window.location.href = "giangvien/dashboard.html";
      });
    </script>
  </body>
</html>
